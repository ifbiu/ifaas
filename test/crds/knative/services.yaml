# Minimal KnativeService CRD for envtest only.
#
# Why this file exists:
#   * Upstream knative/serving CRDs declare an explicit structural schema and
#     deliberately omit pod fields such as lifecycle, terminationGracePeriod,
#     affinity, etc. Those fields are gated by Knative's config-features
#     ConfigMap; apiserver structural-schema validation rejects them even when
#     the feature is enabled cluster-side.
#   * envtest has no Knative controllers, no feature-gate machinery and no need
#     to enforce the same shape. All it needs is "accept anything, persist it,
#     hand it back unchanged" so the operator's SSA succeeds.
#
# So we ship the smallest CRD that:
#   * matches GVK serving.knative.dev/v1 Service
#   * exposes a status subresource so .status writes work
#   * preserves unknown fields under both spec and status, letting kservingv1
#     PodSpecs round-trip in their entirety.
#
# Production installations must use the real CRDs that ship with knative/serving
# and enable kubernetes.podspec-lifecycle in config-features. S11 e2e exercises
# that path against a real Knative install.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: services.serving.knative.dev
  labels:
    app.kubernetes.io/name: ifaas-envtest
    knative.dev/crd-install: "true"
spec:
  group: serving.knative.dev
  names:
    kind: Service
    listKind: ServiceList
    plural: services
    singular: service
    shortNames:
      - ksvc
      - kservice
    categories:
      - knative
      - serving
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true