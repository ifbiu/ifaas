---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-ifaas-ifbiu-com-v1alpha1-knativeadoption
  failurePolicy: Fail
  name: mknativeadoption-v1alpha1.kb.io
  rules:
  - apiGroups:
    - ifaas.ifbiu.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - knativeadoptions
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-ifaas-ifbiu-com-v1alpha1-knativeadoption
  failurePolicy: Fail
  name: vknativeadoption-v1alpha1.kb.io
  rules:
  - apiGroups:
    - ifaas.ifbiu.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - knativeadoptions
  sideEffects: None
