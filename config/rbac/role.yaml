---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/proxy
  verbs:
  - get
- apiGroups:
  - ifaas.ifbiu.com
  resources:
  - knativeadoptions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ifaas.ifbiu.com
  resources:
  - knativeadoptions/finalizers
  verbs:
  - update
- apiGroups:
  - ifaas.ifbiu.com
  resources:
  - knativeadoptions/status
  verbs:
  - get
  - patch
  - update
