# This rule is not used by the project ifaas itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the ifaas.ifbiu.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ifaas
    app.kubernetes.io/managed-by: kustomize
  name: ifaas-knativeadoption-editor-role
rules:
- apiGroups:
  - ifaas.ifbiu.com
  resources:
  - knativeadoptions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ifaas.ifbiu.com
  resources:
  - knativeadoptions/status
  verbs:
  - get
